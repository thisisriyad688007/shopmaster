name: Build Shop Master Pro Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Pre-Download Engine Dependencies (ADB)
      run: |
        mkdir -p bin
        curl -L -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
        tar -xf platform-tools.zip
        cp platform-tools/adb.exe bin/
        cp platform-tools/AdbWinApi.dll bin/
        cp platform-tools/AdbWinUsbApi.dll bin/

    - name: Build Standalone Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "bin;bin" `
          --name "ShopMaster" app.py

    - name: Upload Final Release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ShopMaster-Win64
        path: dist/ShopMaster/
